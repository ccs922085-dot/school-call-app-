<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3학년 교무실 호출</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: sans-serif; text-align: center; padding-top: 50px; 
            background-image: url('https://raw.githubusercontent.com/사용자명/저장소명/main/이미지파일이름.png'); /* 여기에 사진 링크를 넣으세요 */
            background-size: cover; background-position: center; height: 100vh;
        }
        #container { background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 20px; display: inline-block; width: 300px; }
        input, select, button { padding: 12px; margin: 8px; width: 280px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #64ffda; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="container">
        <h1>교무실 호출</h1>
        <select id="teacherSelect">
            <option value="">선생님을 선택하세요</option>
            <script>
                const teachers = ["김건우(국어)", "김영민(사회)", "노여진(국어)", "박기만(윤리)", "이의진(체육)", "이필권(미술)", "이주영(화학)", "홍지연(영어)", "강만규(물리학)", "최아현(지구과학)", "채정태(수학)"];
                teachers.forEach(t => document.write(`<option value="${t}">${t} 선생님</option>`));
            </script>
        </select>
        <input type="text" id="studentNum" placeholder="학번 (예: 30101)">
        <input type="text" id="name" placeholder="이름을 입력하세요">
        <button onclick="sendCall()">호출하기</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://school-call-app-10ee5-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function sendCall() {
            const sel = document.getElementById('teacherSelect');
            const teacher = sel.value;
            const sNum = document.getElementById('studentNum').value;
            const sName = document.getElementById('name').value;
            
            if(!teacher || !sNum || !sName) { alert("모두 입력해주세요!"); return; }
            
            // 음성 안내 기능
            const msg = new SpeechSynthesisUtterance(teacher + " 선생님을 호출합니다.");
            msg.lang = 'ko-KR';
            window.speechSynthesis.speak(msg);
            
            db.ref('calls/').push({ teacher, student: sNum + " " + sName, timestamp: Date.now() });
            alert(teacher + ' 선생님께 호출 완료!');
        }
    </script>
</body>
</html>
