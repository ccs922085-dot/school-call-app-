<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3학년 교무실 호출 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: sans-serif; text-align: center; padding-top: 50px; 
            transition: background 0.5s ease;
            background-size: cover; background-position: center; height: 100vh;
        }
        #container { background: rgba(255, 255, 255, 0.85); padding: 30px; border-radius: 20px; display: inline-block; width: 320px; }
        select, input, button { padding: 12px; margin: 8px; width: 280px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #64ffda; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="container">
        <h1>3학년 교무실 호출</h1>
        <select id="teacherSelect" onchange="updateBackground()">
            <option value="">선생님을 선택하세요</option>
        </select>
        <br>
        <input type="text" id="name" placeholder="본인 학생 이름을 입력하세요">
        <br>
        <button onclick="sendCall()">호출하기</button>
    </div>

    <script>
        const teacherList = [
            "김건우(국어)", "김영민(사회)", "노여진(국어)", "박기만(윤리)", 
            "이의진(체육)", "이필권(미술)", "이주영(화학)", "홍지연(영어)", 
            "강만규(물리학)", "최아현(지구과학)", "채정태(수학)"
        ];

        const select = document.getElementById('teacherSelect');
        teacherList.forEach(name => {
            let opt = document.createElement('option');
            opt.value = name; opt.innerHTML = name + " 선생님";
            select.appendChild(opt);
        });

        function updateBackground() {
            const val = select.value;
            let imgUrl = "https://images.unsplash.com/photo-1523240795612-9a054b0db644";
            if(val.includes("화학")) imgUrl = "https://images.unsplash.com/photo-1532094349884-543bc11b234d";
            else if(val.includes("미술")) imgUrl = "https://images.unsplash.com/photo-1513364776144-60967b0f880f";
            else if(val.includes("체육")) imgUrl = "https://images.unsplash.com/photo-1461896836934-ffe607ba8211";
            else if(val.includes("영어")) imgUrl = "https://images.unsplash.com/photo-1503676260728-1c09da09490b";
            else if(val.includes("국어")) imgUrl = "https://images.unsplash.com/photo-1474932435176-59336187747e";
            
            document.body.style.backgroundImage = "url('" + imgUrl + "')";
        }

        const firebaseConfig = { databaseURL: "https://school-call-app-10ee5-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function sendCall() {
            const teacher = select.value;
            const student = document.getElementById('name').value;
            if(!teacher || !student) { alert("선생님 선택과 이름을 모두 입력해주세요!"); return; }
            db.ref('calls/').push({ teacher, student, timestamp: Date.now() });
            alert(teacher + ' 선생님께 호출을 보냈습니다!');
        }
    </script>
</body>
</html>
