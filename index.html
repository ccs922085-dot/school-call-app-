<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>교무실 호출 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        input { padding: 10px; width: 200px; }
        button { padding: 10px 20px; cursor: pointer; background: #64ffda; border: none; }
    </style>
</head>
<body>
    <h1>교무실 호출하기</h1>
    <input type="text" id="name" placeholder="학생 이름을 입력하세요">
    <br><br>
    <button onclick="sendCall()">호출하기</button>

    <script>
        const firebaseConfig = {
            databaseURL: "https://school-call-app-10ee5-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function sendCall() {
            const name = document.getElementById('name').value;
            if(name === "") { alert("이름을 입력해주세요!"); return; }
            
            db.ref('calls/').push({
                studentName: name,
                timestamp: Date.now()
            });
            alert(name + ' 학생, 호출 완료!');
        }
    </script>
</body>
</html>
