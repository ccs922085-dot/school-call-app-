<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3학년 교무실 (동국관 4층)</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: 'Pretendard', sans-serif;
            text-align: center; padding-top: 50px; 
            /* 이미지 파일명을 정확히 입력했습니다 */
            background-image: url('IMG_0720.PNG'); 
            background-size: cover; background-position: center; height: 100vh;
            background-attachment: fixed;
        }
        #container { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 40px; border-radius: 25px; 
            display: inline-block; width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 20px; }
        input, select, button { 
            padding: 15px; margin: 10px 0; width: 100%; 
            box-sizing: border-box; border-radius: 10px; 
            border: 1px solid #ccc; font-size: 16px;
        }
        button { 
            background: #27ae60; color: white; border: none; 
            cursor: pointer; font-weight: bold; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="container">
        <h1>3학년 교무실 (동국관 4층)</h1>
        <select id="teacherSelect">
            <option value="">선생님을 선택하세요</option>
            <option value="김건우(국어)">김건우(국어) 선생님</option>
            <option value="김영민(사회)">김영민(사회) 선생님</option>
            <option value="노여진(국어)">노여진(국어) 선생님</option>
            <option value="박기만(윤리)">박기만(윤리) 선생님</option>
            <option value="이의진(체육)">이의진(체육) 선생님</option>
            <option value="이필권(미술)">이필권(미술) 선생님</option>
            <option value="이주영(화학)">이주영(화학) 선생님</option>
            <option value="홍지연(영어)">홍지연(영어) 선생님</option>
            <option value="강만규(물리학)">강만규(물리학) 선생님</option>
            <option value="최아현(지구과학)">최아현(지구과학) 선생님</option>
            <option value="채정태(수학)">채정태(수학) 선생님</option>
        </select>
        <input type="text" id="studentNum" placeholder="학번 (예: 30101)">
        <input type="text" id="name" placeholder="이름을 입력하세요">
        <button onclick="sendCall()">호출하기</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://school-call-app-10ee5-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function sendCall() {
            const sel = document.getElementById('teacherSelect');
            const teacher = sel.value;
            const sNum = document.getElementById('studentNum').value;
            const sName = document.getElementById('name').value;
            
            if(!teacher || !sNum || !sName) { alert("항목을 모두 입력해주세요!"); return; }
            
            // 방송 컨셉 멘트
            const announcement = "교무실에서 안내 말씀 드립니다. " + sNum + " " + sName + " 학생이, " + teacher + " 선생님을 호출합니다.";
            
            const msg = new SpeechSynthesisUtterance(announcement);
            msg.lang = 'ko-KR';
            msg.rate = 0.9; // 방송 느낌의 차분한 속도
            window.speechSynthesis.speak(msg);
            
            db.ref('calls/').push({ teacher, student: sNum + " " + sName, timestamp: Date.now() });
            alert(teacher + ' 선생님께 호출이 전송되었습니다!');
        }
    </script>
</body>
</html>
