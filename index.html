<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3학년 교무실 호출 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: sans-serif; text-align: center; padding-top: 50px; 
            background-size: cover; background-position: center; height: 100vh;
            transition: background 0.8s ease;
        }
        #container { background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 20px; display: inline-block; width: 300px; }
        input, select, button { padding: 12px; margin: 8px; width: 280px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #64ffda; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body style="background-image: url('https://images.unsplash.com/photo-1523240795612-9a054b0db644');">

    <div id="container">
        <h1>3학년 교무실 호출</h1>
        <select id="teacherSelect" onchange="updateBackground()">
            <option value="">선생님을 선택하세요</option>
        </select>
        <input type="text" id="studentNum" placeholder="학번을 입력하세요 (예: 30101)">
        <input type="text" id="name" placeholder="이름을 입력하세요">
        <button onclick="sendCall()">호출하기</button>
    </div>

    <script>
        const teacherList = ["김건우(국어)", "김영민(사회)", "노여진(국어)", "박기만(윤리)", "이의진(체육)", "이필권(미술)", "이주영(화학)", "홍지연(영어)", "강만규(물리학)", "최아현(지구과학)", "채정태(수학)"];
        const select = document.getElementById('teacherSelect');
        teacherList.forEach(name => {
            let opt = document.createElement('option');
            opt.value = name; opt.innerHTML = name + " 선생님";
            select.appendChild(opt);
        });

        function updateBackground() {
            const val = select.value;
            let img = "https://images.unsplash.com/photo-1523240795612-9a054b0db644";
            if(val.includes("국어")) img = "https://images.unsplash.com/photo-1474932435176-59336187747e";
            else if(val.includes("사회")) img = "https://images.unsplash.com/photo-1529156069898-49953e39b3ac";
            else if(val.includes("윤리")) img = "https://images.unsplash.com/photo-1507842217343-583bb7270b66";
            else if(val.includes("체육")) img = "https://images.unsplash.com/photo-1461896836934-ffe607ba8211";
            else if(val.includes("미술")) img = "https://images.unsplash.com/photo-1513364776144-60967b0f880f";
            else if(val.includes("화학")) img = "https://images.unsplash.com/photo-1532094349884-543bc11b234d";
            else if(val.includes("영어")) img = "https://images.unsplash.com/photo-1503676260728-1c09da09490b";
            else if(val.includes("물리학")) img = "https://images.unsplash.com/photo-1636466497217-26a8c8df0aa2";
            else if(val.includes("지구과학")) img = "https://images.unsplash.com/photo-1451187580459-43490279c0fa";
            else if(val.includes("수학")) img = "https://images.unsplash.com/photo-1509228468518-180dd28649d4";
            document.body.style.backgroundImage = "url('" + img + "')";
        }

        const firebaseConfig = { databaseURL: "https://school-call-app-10ee5-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function sendCall() {
            const teacher = select.value;
            const studentNum = document.getElementById('studentNum').value;
            const studentName = document.getElementById('name').value;
            
            if(!teacher || !studentNum || !studentName) { alert("모든 항목을 입력해주세요!"); return; }
            
            // 효과음 재생
            const audio = new Audio('https://actions.google.com/sounds/v1/notifications/bell_original.ogg');
            audio.play();
            
            db.ref('calls/').push({ 
                teacher, 
                student: studentNum + " " + studentName, 
                timestamp: Date.now() 
            });
            alert(teacher + ' 선생님께 호출을 보냈습니다!');
        }
    </script>
</body>
</html>
